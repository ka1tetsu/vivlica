<style>

  .hint {

  /* ---------- モード切り替え ---------- */

  /* ---------- ゲームHUD ---------- */

  #score-box { position: fixed; top: 16px; left: 20px; }

  .sub-btn {

  #result-score {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(2.6rem, 11vw, 5rem); font-weight: 900; color: #fff;
    text-shadow: 0 0 22px rgba(140,200,255,0.95), 0 0 70px rgba(150,130,255,0.6);

  @keyframes glowPulse {

  @keyframes fadeFloat { 0%,100% { opacity: .8; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-8px); } }

</style>

<body>

</div>

<div id="hud" hidden>
  <div id="score-box">
    <div id="score-label">SCORE</div>

  </div>

    60秒間、光の魚にふれて流れ星に変えよう<br>
    連続キャッチで <em>コンボ倍率UP</em><br>
    <em>金色の魚</em> は高得点 ＆ ゲージ大量チャージ<br>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('ocean');
  const ctx = canvas.getContext('2d');
  const $ = (id) => document.getElementById(id);

  let W = 0, H = 0, DPR = 1;
  let bgFade = null, bgFull = null;

  function makeGradients() {
    bgFade = ctx.createLinearGradient(0, 0, 0, H);
    bgFade.addColorStop(0,   'rgba(2, 6, 26, 0.16)');
    bgFade.addColorStop(0.35,'rgba(4, 14, 48, 0.16)');
    bgFade.addColorStop(0.7, 'rgba(6, 24, 70, 0.16)');
    bgFade.addColorStop(1,   'rgba(2, 10, 40, 0.16)');

    bgFull = ctx.createLinearGradient(0, 0, 0, H);
    bgFull.addColorStop(0,   '#02061a');
    bgFull.addColorStop(0.35,'#040e30');
    bgFull.addColorStop(0.7, '#061846');
    bgFull.addColorStop(1,   '#020a28');
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    makeGradients();
    ctx.fillStyle = bgFull;
    ctx.fillRect(0, 0, W, H);
  }
  resize();
  window.addEventListener('resize', resize);

  const rand = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;

  const HUES = [190, 198, 206, 215, 228, 252, 285, 318];
  const ACCENT_HUES = [318, 45, 285];
  const GOLD = 48;

  function flowAngle(x, y, t) {
    return Math.sin(y * 0.0028 + t * 0.00038) * 0.9
         + Math.cos(x * 0.0021 - t * 0.00027) * 0.7
         + Math.sin((x + y) * 0.0011 + t * 0.0002) * 0.5;
  }

  /* ================= サウンド（WebAudio シンセ） ================= */
  let audio = null;
  function ensureAudio() {
    if (!audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audio = new AC();
    }
    if (audio && audio.state === 'suspended') audio.resume();
  }
  function tone(freq, dur, type, vol, delay) {
    if (!audio) return;
    const t0 = audio.currentTime + (delay || 0);
    const osc = audio.createOscillator();
    const g = audio.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(vol || 0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(audio.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }
  // コンボが上がるほど音程が上がる —— 報酬感の核
  function catchSound(combo, golden) {
    const step = Math.min(combo, 24);
    const f = 392 * Math.pow(2, step / 12);
    tone(f, 0.16, 'triangle', 0.14);
    tone(f * 2, 0.1, 'sine', 0.05);
    if (golden) { tone(f * 1.5, 0.25, 'square', 0.05, 0.04); tone(f * 3, 0.2, 'sine', 0.06, 0.04); }
  }
  function feverSound() {
    [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.3, 'triangle', 0.13, i * 0.08));
  }
  function endSound() {
    [392, 494, 587, 784].forEach((f, i) => tone(f, 0.8, 'sine', 0.1, i * 0.12));
  }
  function recordSound() {
    [784, 988, 1175, 1568, 1976].forEach((f, i) => tone(f, 0.4, 'triangle', 0.11, 0.6 + i * 0.09));
  }
  function startSound() { tone(523, 0.15, 'triangle', 0.1); tone(784, 0.2, 'triangle', 0.1, 0.12); }

  /* ================= 光の魚 ================= */
  class Fish {
    constructor(fromEdge, golden) {
      this.golden = !!golden;
      this.reset(fromEdge);
    }

    reset(fromEdge) {
      this.size = this.golden ? rand(8, 13) : rand(5, 11);
      this.speed = this.golden ? rand(2.2, 3.4) : rand(1.1, 2.4);
      this.hue = this.golden ? GOLD : HUES[Math.floor(Math.random() * HUES.length)];
      this.hueDrift = this.golden ? 0 : rand(-0.06, 0.06);
      this.heading = rand(0, TAU);
      this.wander = rand(0, TAU);
      this.y = rand(H * 0.08, H * 0.95);
      this.x = fromEdge ? (Math.random() < 0.5 ? -40 : W + 40) : rand(0, W);
      if (fromEdge) this.heading = this.x < 0 ? 0 : Math.PI;
      this.trail = [];
      this.trailMax = Math.floor(rand(26, 46));
      this.sparkleTimer = 0;
    }

    update(t, fleeFrom) {
      const flow = flowAngle(this.x, this.y, t);
      this.wander += rand(-0.12, 0.12);
      const target = flow + Math.sin(this.wander) * 0.7;
      let d = target - this.heading;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      this.heading += d * 0.035;

      this.x += Math.cos(this.heading) * this.speed;
      this.y += Math.sin(this.heading) * this.speed;
      this.hue += this.hueDrift;

      // ゲーム中はカーソルからゆるやかに逃げる
      if (fleeFrom) {
        const dx = this.x - fleeFrom.x;
        const dy = this.y - fleeFrom.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 0.001 && dist < 130) {
          const force = (1 - dist / 130) * 2.2;
          this.x += (dx / dist) * force;
          this.y += (dy / dist) * force;
        }
      }

      this.trail.push({ x: this.x, y: this.y });
      if (this.trail.length > this.trailMax) this.trail.shift();

      let wrapped = false;
      if (this.x < -60) { this.x = W + 50; wrapped = true; }
      if (this.x > W + 60) { this.x = -50; wrapped = true; }
      if (this.y < -60) { this.y = H + 50; wrapped = true; }
      if (this.y > H + 60) { this.y = -50; wrapped = true; }
      if (wrapped) this.trail = [];

      this.sparkleTimer -= 1;
      if (this.sparkleTimer <= 0) {
        this.sparkleTimer = this.golden ? rand(3, 8) : rand(6, 18);
        sparkles.push(new Sparkle(this.x, this.y, this.hue));
      }
    }

    draw(ctx, fever, t) {
      const hue = fever ? (t * 0.12 + this.x * 0.2) % 360 : this.hue;
      const n = this.trail.length;
      for (let i = 0; i < n; i++) {
        const p = this.trail[i];
        const f = (i + 1) / n;
        ctx.beginPath();
        ctx.arc(p.x, p.y, this.size * f, 0, TAU);
        ctx.fillStyle = 'hsla(' + hue + ', 95%, ' + (55 + f * 20) + '%, ' + (0.055 * f) + ')';
        ctx.fill();
      }

      const r = this.size * 2.4;
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
      g.addColorStop(0, 'rgba(255,255,255,0.95)');
      g.addColorStop(0.25, 'hsla(' + hue + ', 100%, 78%, 0.8)');
      g.addColorStop(1, 'hsla(' + hue + ', 100%, 60%, 0)');
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, TAU);
      ctx.fillStyle = g;
      ctx.fill();

      // 金色の魚はリングをまとう
      if (this.golden) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, r * (1.15 + 0.15 * Math.sin(t * 0.008)), 0, TAU);
        ctx.strokeStyle = 'hsla(' + GOLD + ', 100%, 75%, 0.5)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    hit(px, py) {
      const dx = px - this.x;
      const dy = py - this.y;
      const r = Math.max(this.size * 4.5, 34);
      return dx * dx + dy * dy < r * r;
    }
  }

  /* ================= 流れ星 ================= */
  class ShootingStar {
    constructor(x, y, hue) {
      this.x = x; this.y = y; this.hue = hue;
      const angle = rand(-Math.PI * 0.76, -Math.PI * 0.56);
      const speed = rand(8, 13);
      this.vx = Math.cos(angle) * speed * (Math.random() < 0.5 ? 1 : -1);
      this.vy = Math.sin(angle) * speed;
      this.life = 1;
      this.trail = [];
      this.size = rand(3.5, 5.5);
      this.twinkle = rand(0, TAU);
    }

    update() {
      this.trail.push({ x: this.x, y: this.y });
      if (this.trail.length > 42) this.trail.shift();
      this.x += this.vx;
      this.y += this.vy;
      this.vy -= 0.055;
      this.twinkle += 0.4;
      if (Math.random() < 0.5) sparkles.push(new Sparkle(this.x + rand(-6, 6), this.y + rand(-6, 6), this.hue));
      if (this.y < -90 || this.x < -130 || this.x > W + 130) this.life -= 0.07;
      return this.life > 0;
    }

    draw(ctx) {
      const n = this.trail.length;
      for (let i = 0; i < n; i++) {
        const p = this.trail[i];
        const f = (i + 1) / n;
        ctx.beginPath();
        ctx.arc(p.x, p.y, this.size * f, 0, TAU);
        ctx.fillStyle = 'hsla(' + this.hue + ', 100%, 75%, ' + (0.4 * f * this.life) + ')';
        ctx.fill();
      }
      const tw = 1 + Math.sin(this.twinkle) * 0.35;
      const r = this.size * 2.4 * tw;
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
      g.addColorStop(0, 'rgba(255,255,255,0.98)');
      g.addColorStop(0.4, 'hsla(' + this.hue + ', 100%, 80%, 0.9)');
      g.addColorStop(1, 'hsla(' + this.hue + ', 100%, 65%, 0)');
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, TAU);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.8 * this.life) + ')';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(this.x - r * 1.8, this.y); ctx.lineTo(this.x + r * 1.8, this.y);
      ctx.moveTo(this.x, this.y - r * 1.8); ctx.lineTo(this.x, this.y + r * 1.8);
      ctx.stroke();
    }
  }

  /* ================= 花びらの光 ================= */
  class Petal {
    constructor(x, y, hue) {
      this.x = x; this.y = y;
      this.hue = Math.random() < 0.5 ? hue : ACCENT_HUES[Math.floor(Math.random() * ACCENT_HUES.length)];
      const a = rand(0, TAU);
      const sp = rand(0.6, 4.5);
      this.vx = Math.cos(a) * sp;
      this.vy = Math.sin(a) * sp - rand(0.2, 1);
      this.rot = rand(0, TAU);
      this.rotSpeed = rand(-0.12, 0.12);
      this.w = rand(2.5, 6);
      this.h = rand(1.2, 2.6);
      this.life = 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.975;
      this.vy = this.vy * 0.975 - 0.012;
      this.rot += this.rotSpeed;
      this.life -= 0.012;
      return this.life > 0;
    }

    draw(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);
      ctx.beginPath();
      ctx.ellipse(0, 0, this.w * this.life + 0.1, this.h * this.life + 0.1, 0, 0, TAU);
      ctx.fillStyle = 'hsla(' + this.hue + ', 95%, 75%, ' + (0.8 * this.life) + ')';
      ctx.fill();
      ctx.restore();
    }
  }

  /* ================= きらめき ================= */
  class Sparkle {
    constructor(x, y, hue) {
      this.x = x + rand(-3, 3);
      this.y = y + rand(-3, 3);
      this.hue = hue;
      this.r = rand(0.5, 1.8);
      this.life = rand(0.5, 1);
      this.vy = rand(-0.3, 0.1);
    }
    update() { this.y += this.vy; this.life -= 0.02; return this.life > 0; }
    draw(ctx) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r * this.life + 0.1, 0, TAU);
      ctx.fillStyle = 'hsla(' + this.hue + ', 100%, 85%, ' + (0.75 * this.life) + ')';
      ctx.fill();
    }
  }

  /* ================= 波紋 ================= */
  class Ripple {
    constructor(x, y, big) {
      this.x = x; this.y = y;
      this.r = big ? 6 : 3;
      this.speed = big ? 4.2 : 2.6;
      this.alpha = big ? 0.55 : 0.3;
    }
    update() { this.r += this.speed; this.speed *= 0.985; this.alpha *= 0.955; return this.alpha > 0.01; }
    draw(ctx) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, TAU);
      ctx.strokeStyle = 'hsla(200, 100%, 80%, ' + this.alpha + ')';
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r * 0.62, 0, TAU);
      ctx.strokeStyle = 'hsla(260, 100%, 82%, ' + this.alpha * 0.6 + ')';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  /* ================= スコアのポップアップ ================= */
  class Popup {
    constructor(x, y, text, big, hue) {
      this.x = x; this.y = Math.max(y, 40);
      this.text = text;
      this.big = big;
      this.hue = hue;
      this.life = 1;
    }
    update() { this.y -= 1.3; this.life -= 0.022; return this.life > 0; }
    draw(ctx) {
      const size = this.big ? 32 : 21;
      ctx.font = '900 ' + size + "px 'Helvetica Neue', Arial, sans-serif";
      ctx.textAlign = 'center';
      ctx.fillStyle = 'hsla(' + this.hue + ', 100%, 80%, ' + this.life + ')';
      ctx.fillText(this.text, this.x, this.y);
      ctx.fillStyle = 'rgba(255,255,255,' + this.life * 0.5 + ')';
      ctx.fillText(this.text, this.x, this.y);
    }
  }

  /* ================= 漂う光 ================= */
  class Mote {
    constructor() {
      this.x = rand(0, W); this.y = rand(0, H);
      this.r = rand(0.5, 2.2);
      this.phase = rand(0, TAU);
      this.speed = rand(0.06, 0.3);
      this.hue = HUES[Math.floor(Math.random() * HUES.length)];
    }
    update(t) {
      this.y -= this.speed;
      this.x += Math.sin(t * 0.0006 + this.phase) * 0.25;
      if (this.y < -10) { this.y = H + 10; this.x = rand(0, W); }
      this.alpha = 0.12 + 0.3 * (0.5 + 0.5 * Math.sin(t * 0.0016 + this.phase));
    }
    draw(ctx) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, TAU);
      ctx.fillStyle = 'hsla(' + this.hue + ', 90%, 80%, ' + this.alpha + ')';
      ctx.fill();
    }
  }

  class Bokeh {
    constructor() {
      this.x = rand(0, W); this.y = rand(0, H);
      this.r = rand(18, 70);
      this.phase = rand(0, TAU);
      this.hue = HUES[Math.floor(Math.random() * HUES.length)];
      this.speed = rand(0.02, 0.1);
    }
    update(t) {
      this.y -= this.speed;
      if (this.y < -this.r) { this.y = H + this.r; this.x = rand(0, W); }
      this.alpha = 0.015 + 0.02 * (0.5 + 0.5 * Math.sin(t * 0.0007 + this.phase));
    }
    draw(ctx) {
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r);
      g.addColorStop(0, 'hsla(' + this.hue + ', 100%, 75%, ' + this.alpha + ')');
      g.addColorStop(1, 'hsla(' + this.hue + ', 100%, 75%, 0)');
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, TAU);
      ctx.fillStyle = g;
      ctx.fill();
    }
  }

  /* ================= 状態 ================= */
  const fishes = [];
  const stars = [];
  const petals = [];
  const sparkles = [];
  const ripples = [];
  const motes = [];
  const bokehs = [];
  const popups = [];
  const respawnQueue = [];

  const AMBIENT_FISH = Math.min(16, Math.max(9, Math.floor(W * H / 90000)));
  for (let i = 0; i < AMBIENT_FISH; i++) fishes.push(new Fish(false));
  for (let i = 0; i < 70; i++) motes.push(new Mote());
  for (let i = 0; i < 9; i++) bokehs.push(new Bokeh());

  let mode = 'ambient'; // 'ambient' | 'game'
  const BEST_KEY = 'vivlica_best_score';
  const game = {
    state: 'ready', // 'ready' | 'playing' | 'result'
    score: 0,
    combo: 0,
    maxCombo: 0,
    mult: 1,
    time: 60,
    lastCatch: 0,
    gauge: 0,
    feverUntil: 0,
    lastSpawn: 0,
    best: parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0,
  };
  const GAME_LEN = 60;
  const COMBO_WINDOW = 1800;
  const GAUGE_MAX = 15;
  const FEVER_LEN = 6500;

  let shake = 0;
  const pointer = { x: -9999, y: -9999, active: false };

  /* ================= UI 要素 ================= */
  const elOverlay = $('ambient-overlay');
  const elHint = $('hint');
  const elHud = $('hud');
  const elScore = $('score');
  const elTimer = $('timer');
  const elCombo = $('combo');
  const elComboNum = elCombo.querySelector('.num');
  const elComboMult = elCombo.querySelector('.mult');
  const elFever = $('fever-banner');
  const elGauge = $('gauge-fill');
  const elFlash = $('flash');
  const elStart = $('start-screen');
  const elResult = $('result-screen');

  function flash(strength) {
    elFlash.style.transition = 'none';
    elFlash.style.opacity = strength;
    requestAnimationFrame(() => {
      elFlash.style.transition = 'opacity 0.3s ease-out';
      elFlash.style.opacity = 0;
    });
  }

  function popClass(el) {
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
  }

  function isFever() { return performance.now() < game.feverUntil; }

  /* ================= モード切り替え ================= */
  function setMode(next) {
    mode = next;
    const gameOn = mode === 'game';
    $('btn-ambient').classList.toggle('active', !gameOn);
    $('btn-game').classList.toggle('active', gameOn);
    elOverlay.classList.toggle('hidden', gameOn);
    elHint.classList.toggle('hidden', gameOn);
    elHud.hidden = true;
    elStart.hidden = true;
    elResult.hidden = true;
    elFever.hidden = true;
    game.state = 'ready';
    if (gameOn) {
      elStart.hidden = false;
    } else {
      // ゲーム終了直後でも海が寂しくならないよう補充する
      while (fishes.length < AMBIENT_FISH) fishes.push(new Fish(true));
    }
  }

  $('btn-ambient').addEventListener('click', () => setMode('ambient'));
  $('btn-game').addEventListener('click', () => { ensureAudio(); setMode('game'); });
  $('btn-start').addEventListener('click', () => { ensureAudio(); startGame(); });
  $('btn-retry').addEventListener('click', () => { ensureAudio(); startGame(); });
  $('btn-to-ambient').addEventListener('click', () => setMode('ambient'));

  /* ================= ゲーム進行 ================= */
  function startGame() {
    game.state = 'playing';
    game.score = 0;
    game.combo = 0;
    game.maxCombo = 0;
    game.mult = 1;
    game.time = GAME_LEN;
    game.gauge = 0;
    game.feverUntil = 0;
    popups.length = 0;
    respawnQueue.length = 0;
    fishes.length = 0;
    for (let i = 0; i < 14; i++) fishes.push(new Fish(false, Math.random() < 0.08));

    elStart.hidden = true;
    elResult.hidden = true;
    elHud.hidden = false;
    elScore.textContent = '0';
    elTimer.textContent = GAME_LEN;
    elTimer.classList.remove('danger');
    elCombo.classList.remove('show');
    elGauge.style.width = '0%';
    startSound();
  }

  function rankFor(score) {
    if (score >= 60000) return 'SS';
    if (score >= 40000) return 'S';
    if (score >= 25000) return 'A';
    if (score >= 13000) return 'B';
    if (score >= 5000)  return 'C';
    return 'D';
  }

  function endGame() {
    game.state = 'result';
    elHud.hidden = true;
    elFever.hidden = true;
    game.feverUntil = 0;

    const isRecord = game.score > game.best;
    if (isRecord) {
      game.best = game.score;
      try { localStorage.setItem(BEST_KEY, String(game.best)); } catch (e) {}
    }

    $('result-score').textContent = game.score.toLocaleString();
    $('result-rank').textContent = 'RANK ' + rankFor(game.score);
    $('result-best').textContent = 'BEST ' + game.best.toLocaleString() + '　/　MAX COMBO ' + game.maxCombo;
    $('new-record').hidden = !isRecord;
    elResult.hidden = false;

    endSound();
    if (isRecord) recordSound();
    flash(0.35);
  }

  function gameCatch(f) {
    const now = performance.now();
    game.combo += 1;
    game.maxCombo = Math.max(game.maxCombo, game.combo);
    game.lastCatch = now;
    game.mult = Math.min(1 + Math.floor(game.combo / 4), 8);

    const fever = isFever();
    const base = f.golden ? 500 : 100;
    const points = base * game.mult * (fever ? 2 : 1);
    game.score += points;

    // フィーバーゲージ
    if (!fever) {
      game.gauge += f.golden ? 5 : 1;
      if (game.gauge >= GAUGE_MAX) {
        game.gauge = 0;
        game.feverUntil = now + FEVER_LEN;
        elFever.hidden = false;
        feverSound();
        flash(0.5);
        shake = 14;
        // フィーバー突入と同時に魚が群れで押し寄せる
        for (let i = 0; i < 8; i++) fishes.push(new Fish(true, Math.random() < 0.3));
      }
    }

    // 演出
    popups.push(new Popup(f.x, f.y - 18, '+' + points.toLocaleString(), f.golden || points >= 1000, f.golden ? GOLD : 200));
    if (game.combo >= 2 && game.combo % 5 === 0) {
      popups.push(new Popup(f.x, f.y - 52, game.combo + ' COMBO!', true, 318));
    }
    shake = Math.max(shake, f.golden ? 10 : 5);
    flash(f.golden ? 0.3 : 0.12);
    catchSound(game.combo, f.golden);

    // HUD更新
    elScore.textContent = game.score.toLocaleString();
    popClass(elScore);
    elComboNum.textContent = game.combo + ' COMBO';
    elComboMult.textContent = '×' + game.mult + (fever ? ' FEVER!' : '');
    elCombo.classList.add('show');
    popClass(elCombo);
    elGauge.style.width = (isFever() ? 100 : (game.gauge / GAUGE_MAX) * 100) + '%';
  }

  /* ================= 魚 → 流れ星 ================= */
  function transform(px, py) {
    for (let i = fishes.length - 1; i >= 0; i--) {
      const f = fishes[i];
      if (f.hit(px, py)) {
        stars.push(new ShootingStar(f.x, f.y, f.hue));
        const petalCount = f.golden ? 46 : 30;
        for (let k = 0; k < petalCount; k++) petals.push(new Petal(f.x, f.y, f.hue));
        ripples.push(new Ripple(f.x, f.y, true));
        fishes.splice(i, 1);

        if (mode === 'game' && game.state === 'playing') {
          gameCatch(f);
          respawnQueue.push(performance.now() + rand(250, 600));
        } else {
          respawnQueue.push(performance.now() + 2400);
        }
        return true;
      }
    }
    return false;
  }

  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  let lastMoveRipple = 0;
  window.addEventListener('pointermove', (e) => {
    const p = pointerPos(e);
    pointer.x = p.x;
    pointer.y = p.y;
    const playing = mode === 'game' && game.state === 'playing';
    // 鑑賞: マウスが触れたら / ゲーム: マウス移動・タッチドラッグで
    if (playing || e.pointerType === 'mouse') {
      if (playing || mode === 'ambient') transform(p.x, p.y);
      const now = performance.now();
      if (now - lastMoveRipple > 160) {
        lastMoveRipple = now;
        ripples.push(new Ripple(p.x, p.y, false));
      }
    }
  });
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    ensureAudio();
    const p = pointerPos(e);
    pointer.x = p.x;
    pointer.y = p.y;
    if (mode === 'game' && game.state !== 'playing') return;
    if (!transform(p.x, p.y)) ripples.push(new Ripple(p.x, p.y, true));
  });

  /* ================= オーロラ ================= */
  function drawAurora(t) {
    for (let k = 0; k < 3; k++) {
      const baseY = H * (0.22 + k * 0.27);
      const hue = isFever() ? (t * 0.08 + k * 120) % 360 : 195 + k * 38;
      ctx.beginPath();
      for (let x = -20; x <= W + 20; x += 24) {
        const y = baseY
          + Math.sin(x * 0.004 + t * 0.0005 + k * 2.1) * H * 0.05
          + Math.sin(x * 0.0013 - t * 0.0003 + k) * H * 0.08;
        if (x === -20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = 'hsla(' + hue + ', 100%, 70%, 0.04)';
      ctx.lineWidth = rand(26, 34);
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.strokeStyle = 'hsla(' + hue + ', 100%, 80%, 0.05)';
      ctx.lineWidth = 8;
      ctx.stroke();
    }
  }

  /* ================= メインループ ================= */
  let lastT = 0;
  function frame(t) {
    const dt = lastT ? Math.min(t - lastT, 100) : 16;
    lastT = t;
    const now = performance.now();
    const playing = mode === 'game' && game.state === 'playing';
    const fever = isFever();

    // 画面シェイク（CSS transformなので残像描画を汚さない）
    if (shake > 0.3) {
      canvas.style.transform = 'translate(' + rand(-shake, shake) + 'px,' + rand(-shake, shake) + 'px)';
      shake *= 0.82;
    } else if (canvas.style.transform) {
      canvas.style.transform = '';
      shake = 0;
    }

    // ゲームタイマー
    if (playing) {
      game.time -= dt / 1000;
      const left = Math.max(0, Math.ceil(game.time));
      elTimer.textContent = left;
      elTimer.classList.toggle('danger', left <= 10);
      if (game.time <= 0) { endGame(); }

      // コンボ切れ
      if (game.combo > 0 && now - game.lastCatch > COMBO_WINDOW) {
        game.combo = 0;
        game.mult = 1;
        elCombo.classList.remove('show');
      }

      // フィーバー終了
      if (!fever && !elFever.hidden) {
        elFever.hidden = true;
        elGauge.style.width = '0%';
      }

      // 魚の補充（ゲーム中は密度高め・フィーバー中はさらに）
      const target = fever ? 22 : 14;
      if (fishes.length < target && now - game.lastSpawn > 220) {
        game.lastSpawn = now;
        fishes.push(new Fish(true, Math.random() < (fever ? 0.35 : 0.08)));
      }
    }

    // 残像レンダリング
    ctx.fillStyle = bgFade;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    drawAurora(t);

    for (const b of bokehs) { b.update(t); b.draw(ctx); }
    for (const m of motes) { m.update(t); m.draw(ctx); }

    const flee = playing ? pointer : null;
    for (const f of fishes) { f.update(t, flee); f.draw(ctx, fever, t); }

    for (let i = sparkles.length - 1; i >= 0; i--) {
      if (!sparkles[i].update()) sparkles.splice(i, 1);
      else sparkles[i].draw(ctx);
    }
    for (let i = petals.length - 1; i >= 0; i--) {
      if (!petals[i].update()) petals.splice(i, 1);
      else petals[i].draw(ctx);
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      if (!ripples[i].update()) ripples.splice(i, 1);
      else ripples[i].draw(ctx);
    }
    for (let i = stars.length - 1; i >= 0; i--) {
      if (!stars[i].update()) stars.splice(i, 1);
      else stars[i].draw(ctx);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      if (!popups[i].update()) popups.splice(i, 1);
      else popups[i].draw(ctx);
    }

    ctx.restore();

    // 鑑賞モードの魚の補充
    if (!playing) {
      while (respawnQueue.length && respawnQueue[0] <= now) {
        respawnQueue.shift();
        if (fishes.length < AMBIENT_FISH + 4) fishes.push(new Fish(true));
      }
    } else {
      // ゲーム中の補充はキュー消化のみ（spawn側で密度管理）
      while (respawnQueue.length && respawnQueue[0] <= now) respawnQueue.shift();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
