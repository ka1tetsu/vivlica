<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>vivlica | 幻想的な深海の世界</title>
<meta name="description" content="vivlica - 青い深海を魚たちが泳ぐ、幻想的で未来的なホームページ。魚にふれると流れ星に変わります。">
<meta name="keywords" content="vivlica, ビブリカ, 海, 魚, 流れ星, 幻想的">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://ka1tetsu.github.io/vivlica/">
<meta property="og:title" content="vivlica | 幻想的な深海の世界">
<meta property="og:description" content="青い深海を魚たちが泳ぐ、幻想的で未来的なホームページ。魚にふれると流れ星に変わります。">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "vivlica",
  "url": "https://ka1tetsu.github.io/vivlica/",
  "description": "青い深海を魚たちが泳ぐ、幻想的で未来的なホームページ"
}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020818;
    font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #ocean {
    position: fixed;
    inset: 0;
    display: block;
    background: linear-gradient(180deg,
      #03102e 0%,
      #041a44 25%,
      #052458 50%,
      #03306e 75%,
      #021c4a 100%);
  }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
  }

  .logo {
    font-size: clamp(2.6rem, 8vw, 5.5rem);
    font-weight: 200;
    letter-spacing: 0.45em;
    text-indent: 0.45em;
    color: #eaf6ff;
    text-shadow:
      0 0 12px rgba(120, 200, 255, 0.9),
      0 0 40px rgba(60, 150, 255, 0.7),
      0 0 90px rgba(40, 110, 255, 0.5);
    animation: glowPulse 4s ease-in-out infinite;
  }

  .greeting {
    margin-top: 1.4rem;
    font-size: clamp(1.1rem, 3.4vw, 1.9rem);
    font-weight: 300;
    letter-spacing: 0.6em;
    text-indent: 0.6em;
    color: #aee0ff;
    text-shadow:
      0 0 10px rgba(130, 200, 255, 0.8),
      0 0 30px rgba(70, 150, 255, 0.5);
    animation: fadeFloat 6s ease-in-out infinite;
  }

  .hint {
    position: fixed;
    bottom: 4.5vh;
    left: 0;
    right: 0;
    text-align: center;
    font-size: clamp(0.65rem, 2vw, 0.85rem);
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    color: rgba(160, 210, 255, 0.55);
    pointer-events: none;
    z-index: 10;
    animation: hintBlink 5s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 12px rgba(120,200,255,.9), 0 0 40px rgba(60,150,255,.7), 0 0 90px rgba(40,110,255,.5); }
    50%      { text-shadow: 0 0 18px rgba(150,220,255,1),  0 0 60px rgba(80,170,255,.9), 0 0 130px rgba(50,130,255,.7); }
  }

  @keyframes fadeFloat {
    0%, 100% { opacity: 0.85; transform: translateY(0); }
    50%      { opacity: 1;    transform: translateY(-6px); }
  }

  @keyframes hintBlink {
    0%, 100% { opacity: 0.3; }
    50%      { opacity: 0.8; }
  }
</style>
</head>
<body>

<canvas id="ocean"></canvas>

<div class="overlay">
  <h1 class="logo">vivlica</h1>
  <p class="greeting">こんにちは</p>
</div>

<p class="hint">魚にふれると、流れ星になります</p>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('ocean');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const rand = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;

  const FISH_COLORS = [
    { body: '#4fc3f7', glow: 'rgba(79,195,247,'  },
    { body: '#7dd3fc', glow: 'rgba(125,211,252,' },
    { body: '#38bdf8', glow: 'rgba(56,189,248,'  },
    { body: '#a5d8ff', glow: 'rgba(165,216,255,' },
    { body: '#22d3ee', glow: 'rgba(34,211,238,'  },
    { body: '#60a5fa', glow: 'rgba(96,165,250,'  },
  ];

  /* ---------- 魚 ---------- */
  class Fish {
    constructor(fromEdge) { this.reset(fromEdge); }

    reset(fromEdge) {
      this.size = rand(14, 30);
      this.speed = rand(0.5, 1.4) * (30 / this.size) * 0.9;
      this.dir = Math.random() < 0.5 ? 1 : -1;
      this.y = rand(H * 0.12, H * 0.92);
      this.x = fromEdge
        ? (this.dir === 1 ? -this.size * 4 : W + this.size * 4)
        : rand(0, W);
      this.wavePhase = rand(0, TAU);
      this.waveAmp = rand(0.25, 0.7);
      this.waveFreq = rand(0.008, 0.02);
      this.tailPhase = rand(0, TAU);
      this.color = FISH_COLORS[Math.floor(Math.random() * FISH_COLORS.length)];
      this.alive = true;
    }

    update(t) {
      this.x += this.speed * this.dir;
      this.y += Math.sin(t * this.waveFreq + this.wavePhase) * this.waveAmp;
      this.tailPhase += 0.18 + this.speed * 0.06;

      const margin = this.size * 5;
      if ((this.dir === 1 && this.x > W + margin) ||
          (this.dir === -1 && this.x < -margin)) {
        this.reset(true);
      }
    }

    draw(ctx) {
      const s = this.size;
      const tail = Math.sin(this.tailPhase) * s * 0.45;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.scale(this.dir, 1);

      ctx.shadowColor = this.color.glow + '0.9)';
      ctx.shadowBlur = s * 1.2;

      // 尾びれ
      ctx.beginPath();
      ctx.moveTo(-s * 0.85, 0);
      ctx.quadraticCurveTo(-s * 1.5, tail * 0.3, -s * 1.7, tail - s * 0.4);
      ctx.quadraticCurveTo(-s * 1.45, tail * 0.5, -s * 1.35, tail * 0.2);
      ctx.quadraticCurveTo(-s * 1.45, tail * 0.5, -s * 1.7, tail + s * 0.4);
      ctx.quadraticCurveTo(-s * 1.5, tail * 0.3, -s * 0.85, 0);
      ctx.fillStyle = this.color.glow + '0.55)';
      ctx.fill();

      // 胴体
      const grad = ctx.createLinearGradient(-s, 0, s, 0);
      grad.addColorStop(0, this.color.glow + '0.65)');
      grad.addColorStop(0.6, this.color.body);
      grad.addColorStop(1, '#e8f7ff');
      ctx.beginPath();
      ctx.moveTo(s, 0);
      ctx.quadraticCurveTo(s * 0.35, -s * 0.62, -s * 0.55, -s * 0.28);
      ctx.quadraticCurveTo(-s * 0.95, 0, -s * 0.55, s * 0.28);
      ctx.quadraticCurveTo(s * 0.35, s * 0.62, s, 0);
      ctx.fillStyle = grad;
      ctx.fill();

      // 背びれ
      ctx.beginPath();
      ctx.moveTo(-s * 0.1, -s * 0.42);
      ctx.quadraticCurveTo(s * 0.1, -s * 0.85, s * 0.32, -s * 0.4);
      ctx.fillStyle = this.color.glow + '0.5)';
      ctx.fill();

      ctx.shadowBlur = 0;

      // 目
      ctx.beginPath();
      ctx.arc(s * 0.55, -s * 0.08, s * 0.09, 0, TAU);
      ctx.fillStyle = '#04122e';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(s * 0.58, -s * 0.11, s * 0.03, 0, TAU);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.restore();
    }

    hit(px, py) {
      const dx = px - this.x;
      const dy = py - this.y;
      const r = Math.max(this.size * 1.6, 28);
      return dx * dx + dy * dy < r * r;
    }
  }

  /* ---------- 流れ星 ---------- */
  class ShootingStar {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = rand(-Math.PI * 0.78, -Math.PI * 0.55); // 斜め上へ
      const speed = rand(9, 14);
      this.vx = Math.cos(angle) * speed * (Math.random() < 0.5 ? 1 : -1);
      this.vy = Math.sin(angle) * speed;
      this.life = 1;
      this.trail = [];
      this.size = rand(3.5, 5.5);
      this.twinkle = rand(0, TAU);
    }

    update() {
      this.trail.push({ x: this.x, y: this.y, life: 1 });
      if (this.trail.length > 36) this.trail.shift();
      for (const p of this.trail) p.life *= 0.93;

      this.x += this.vx;
      this.y += this.vy;
      this.vy -= 0.06; // ゆるやかに加速して天へ
      this.twinkle += 0.4;

      if (this.y < -80 || this.x < -120 || this.x > W + 120) {
        this.life -= 0.08;
      }
      return this.life > 0;
    }

    draw(ctx) {
      // 軌跡
      for (let i = 0; i < this.trail.length; i++) {
        const p = this.trail[i];
        const f = i / this.trail.length;
        ctx.beginPath();
        ctx.arc(p.x, p.y, this.size * f * p.life, 0, TAU);
        ctx.fillStyle = this.color.glow + (0.5 * f * p.life) + ')';
        ctx.fill();
      }

      // 星本体（十字の煌めき）
      const tw = 1 + Math.sin(this.twinkle) * 0.35;
      const r = this.size * 2.2 * tw;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 25;

      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.4, this.color.glow + '0.9)');
      grad.addColorStop(1, this.color.glow + '0)');
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, TAU);
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,' + (0.85 * this.life) + ')';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(-r * 1.7, 0); ctx.lineTo(r * 1.7, 0);
      ctx.moveTo(0, -r * 1.7); ctx.lineTo(0, r * 1.7);
      ctx.stroke();

      ctx.restore();
    }
  }

  /* ---------- 変身バースト ---------- */
  class Burst {
    constructor(x, y, color) {
      this.particles = [];
      for (let i = 0; i < 26; i++) {
        const a = rand(0, TAU);
        const sp = rand(1, 6);
        this.particles.push({
          x, y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          life: 1,
          size: rand(1.5, 4),
          color,
        });
      }
    }

    update() {
      for (const p of this.particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.life -= 0.025;
      }
      this.particles = this.particles.filter(p => p.life > 0);
      return this.particles.length > 0;
    }

    draw(ctx) {
      for (const p of this.particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, TAU);
        ctx.fillStyle = p.color.glow + p.life + ')';
        ctx.fill();
      }
    }
  }

  /* ---------- 泡 ---------- */
  class Bubble {
    constructor() { this.reset(true); }

    reset(randomY) {
      this.x = rand(0, W);
      this.y = randomY ? rand(0, H) : H + 20;
      this.r = rand(1.5, 5);
      this.speed = rand(0.3, 1.1);
      this.sway = rand(0, TAU);
      this.swaySpeed = rand(0.01, 0.03);
    }

    update() {
      this.y -= this.speed;
      this.sway += this.swaySpeed;
      this.x += Math.sin(this.sway) * 0.4;
      if (this.y < -20) this.reset(false);
    }

    draw(ctx) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, TAU);
      ctx.strokeStyle = 'rgba(170, 220, 255, 0.35)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(this.x - this.r * 0.3, this.y - this.r * 0.3, this.r * 0.3, 0, TAU);
      ctx.fillStyle = 'rgba(220, 245, 255, 0.4)';
      ctx.fill();
    }
  }

  /* ---------- 漂う光の粒 ---------- */
  class Mote {
    constructor() {
      this.x = rand(0, W);
      this.y = rand(0, H);
      this.r = rand(0.5, 2);
      this.phase = rand(0, TAU);
      this.speed = rand(0.05, 0.25);
    }

    update(t) {
      this.y -= this.speed;
      if (this.y < -10) { this.y = H + 10; this.x = rand(0, W); }
      this.alpha = 0.15 + 0.25 * (0.5 + 0.5 * Math.sin(t * 0.002 + this.phase));
    }

    draw(ctx) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, TAU);
      ctx.fillStyle = 'rgba(150, 210, 255, ' + this.alpha + ')';
      ctx.fill();
    }
  }

  /* ---------- 状態 ---------- */
  const FISH_COUNT = 13;
  const fishes = [];
  const stars = [];
  const bursts = [];
  const bubbles = [];
  const motes = [];
  const respawnQueue = [];

  for (let i = 0; i < FISH_COUNT; i++) fishes.push(new Fish(false));
  for (let i = 0; i < 22; i++) bubbles.push(new Bubble());
  for (let i = 0; i < 60; i++) motes.push(new Mote());

  /* ---------- 魚 → 流れ星 ---------- */
  function transform(px, py) {
    for (let i = fishes.length - 1; i >= 0; i--) {
      const f = fishes[i];
      if (f.hit(px, py)) {
        stars.push(new ShootingStar(f.x, f.y, f.color));
        bursts.push(new Burst(f.x, f.y, f.color));
        fishes.splice(i, 1);
        respawnQueue.push(performance.now() + 2200);
        return;
      }
    }
  }

  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  // PC: カーソルが触れたら / スマホ: タッチしたら
  window.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'mouse') {
      const p = pointerPos(e);
      transform(p.x, p.y);
    }
  });
  window.addEventListener('pointerdown', (e) => {
    const p = pointerPos(e);
    transform(p.x, p.y);
  });

  /* ---------- 光のカーテン（ゴッドレイ） ---------- */
  function drawRays(t) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5; i++) {
      const baseX = W * (0.12 + i * 0.19);
      const sway = Math.sin(t * 0.0003 + i * 1.7) * W * 0.05;
      const topX = baseX + sway;
      const width = W * (0.04 + 0.02 * Math.sin(t * 0.0004 + i));
      const grad = ctx.createLinearGradient(topX, 0, topX + W * 0.1, H);
      grad.addColorStop(0, 'rgba(120, 190, 255, 0.10)');
      grad.addColorStop(0.5, 'rgba(90, 160, 255, 0.04)');
      grad.addColorStop(1, 'rgba(60, 130, 255, 0)');
      ctx.beginPath();
      ctx.moveTo(topX - width, 0);
      ctx.lineTo(topX + width, 0);
      ctx.lineTo(topX + width * 4 + W * 0.06, H);
      ctx.lineTo(topX - width * 4 + W * 0.06, H);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
    }
    ctx.restore();
  }

  /* ---------- メインループ ---------- */
  function frame(t) {
    ctx.clearRect(0, 0, W, H);

    drawRays(t);

    for (const m of motes) { m.update(t); m.draw(ctx); }
    for (const b of bubbles) { b.update(); b.draw(ctx); }

    for (const f of fishes) { f.update(t); f.draw(ctx); }

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = stars.length - 1; i >= 0; i--) {
      if (!stars[i].update()) stars.splice(i, 1);
      else stars[i].draw(ctx);
    }
    for (let i = bursts.length - 1; i >= 0; i--) {
      if (!bursts[i].update()) bursts.splice(i, 1);
      else bursts[i].draw(ctx);
    }
    ctx.restore();

    // 魚の補充
    const now = performance.now();
    while (respawnQueue.length && respawnQueue[0] <= now) {
      respawnQueue.shift();
      fishes.push(new Fish(true));
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
