<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>vivlica | 幻想的な深海の世界</title>

<meta name="keywords" content="vivlica, ビブリカ, 海, 魚, 流れ星, 幻想的">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://ka1tetsu.github.io/vivlica/">
<meta property="og:title" content="vivlica | 幻想的な深海の世界">
<meta property="og:description" content="青い深海を光の魚たちが泳ぐ、幻想的で未来的なホームページ。魚にふれると流れ星に変わります。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ka1tetsu.github.io/vivlica/">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "vivlica",
  "url": "https://ka1tetsu.github.io/vivlica/",
  "description": "青い深海を光の魚たちが泳ぐ、幻想的で未来的なホームページ"
}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #010514;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #ocean {
    position: fixed;
    inset: 0;
    display: block;
  }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    background:
      radial-gradient(ellipse at 50% 45%,
        rgba(0, 0, 0, 0) 45%,
        rgba(1, 4, 18, 0.45) 100%);
  }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
  }

  .logo {
    font-size: clamp(2.4rem, 8vw, 5.2rem);
    font-weight: 200;
    letter-spacing: 0.55em;
    text-indent: 0.55em;
    color: #f2faff;
    text-shadow:
      0 0 14px rgba(140, 215, 255, 0.95),
      0 0 45px rgba(90, 170, 255, 0.75),
      0 0 110px rgba(120, 110, 255, 0.55);
    animation: glowPulse 6s ease-in-out infinite;
  }

  .greeting {
    margin-top: 1.6rem;
    font-size: clamp(1.05rem, 3.4vw, 1.8rem);
    font-weight: 300;
    letter-spacing: 0.7em;
    text-indent: 0.7em;
    color: #c8e9ff;
    text-shadow:
      0 0 12px rgba(150, 215, 255, 0.85),
      0 0 36px rgba(110, 160, 255, 0.55),
      0 0 70px rgba(180, 130, 255, 0.35);
    animation: fadeFloat 7s ease-in-out infinite;
  }

  .hint {
    position: fixed;
    bottom: 4.5vh;
    left: 0;
    right: 0;
    text-align: center;
    font-size: clamp(0.62rem, 2vw, 0.8rem);
    letter-spacing: 0.4em;
    text-indent: 0.4em;
    color: rgba(175, 220, 255, 0.5);
    pointer-events: none;
    z-index: 10;
    animation: hintBlink 6s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 14px rgba(140,215,255,.95), 0 0 45px rgba(90,170,255,.75), 0 0 110px rgba(120,110,255,.55); }
    50%      { text-shadow: 0 0 22px rgba(170,230,255,1),  0 0 70px rgba(110,190,255,.95), 0 0 150px rgba(160,130,255,.75); }
  }

  @keyframes fadeFloat {
    0%, 100% { opacity: 0.8; transform: translateY(0); }
    50%      { opacity: 1;   transform: translateY(-8px); }
  }

  @keyframes hintBlink {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 0.75; }
  }
</style>
</head>
<body>

<canvas id="ocean"></canvas>
<div class="vignette"></div>

<div class="overlay">
  <h1 class="logo">vivlica</h1>
  <p class="greeting">こんにちは</p>
</div>

<p class="hint">魚にふれると、流れ星になります</p>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('ocean');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  let bgFade = null, bgFull = null;

  function makeGradients() {
    // 毎フレーム薄く重ねるグラデーション（残像を残すため低アルファ）
    bgFade = ctx.createLinearGradient(0, 0, 0, H);
    bgFade.addColorStop(0,   'rgba(2, 6, 26, 0.16)');
    bgFade.addColorStop(0.35,'rgba(4, 14, 48, 0.16)');
    bgFade.addColorStop(0.7, 'rgba(6, 24, 70, 0.16)');
    bgFade.addColorStop(1,   'rgba(2, 10, 40, 0.16)');

    bgFull = ctx.createLinearGradient(0, 0, 0, H);
    bgFull.addColorStop(0,   '#02061a');
    bgFull.addColorStop(0.35,'#040e30');
    bgFull.addColorStop(0.7, '#061846');
    bgFull.addColorStop(1,   '#020a28');
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    makeGradients();
    ctx.fillStyle = bgFull;
    ctx.fillRect(0, 0, W, H);
  }
  resize();
  window.addEventListener('resize', resize);

  const rand = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;

  // 青を軸に、紫・桃・金の差し色（チームラボ的な光の色彩）
  const HUES = [190, 198, 206, 215, 228, 252, 285, 318];
  const ACCENT_HUES = [318, 45, 285];

  // ゆらぎの流れ場 —— 魚も光もこの流れに乗る
  function flowAngle(x, y, t) {
    return Math.sin(y * 0.0028 + t * 0.00038) * 0.9
         + Math.cos(x * 0.0021 - t * 0.00027) * 0.7
         + Math.sin((x + y) * 0.0011 + t * 0.0002) * 0.5;
  }

  /* ---------- 光の魚（光の帯を曳いて泳ぐ） ---------- */
  class Fish {
    constructor(fromEdge) { this.reset(fromEdge); }

    reset(fromEdge) {
      this.size = rand(5, 11);
      this.speed = rand(1.1, 2.4);
      this.hue = HUES[Math.floor(Math.random() * HUES.length)];
      this.hueDrift = rand(-0.06, 0.06);
      this.heading = rand(0, TAU);
      this.wander = rand(0, TAU);
      this.y = rand(H * 0.08, H * 0.95);
      this.x = fromEdge ? (Math.random() < 0.5 ? -40 : W + 40) : rand(0, W);
      if (fromEdge) this.heading = this.x < 0 ? 0 : Math.PI;
      this.trail = [];
      this.trailMax = Math.floor(rand(26, 46));
      this.sparkleTimer = 0;
    }

    update(t) {
      const flow = flowAngle(this.x, this.y, t);
      this.wander += rand(-0.12, 0.12);
      const target = flow + Math.sin(this.wander) * 0.7;
      // なめらかに流れへ向きを合わせる
      let d = target - this.heading;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      this.heading += d * 0.035;

      this.x += Math.cos(this.heading) * this.speed;
      this.y += Math.sin(this.heading) * this.speed;
      this.hue += this.hueDrift;

      this.trail.push({ x: this.x, y: this.y });
      if (this.trail.length > this.trailMax) this.trail.shift();

      // 画面外へ出たら反対側から（軌跡は引き継がない）
      let wrapped = false;
      if (this.x < -60) { this.x = W + 50; wrapped = true; }
      if (this.x > W + 60) { this.x = -50; wrapped = true; }
      if (this.y < -60) { this.y = H + 50; wrapped = true; }
      if (this.y > H + 60) { this.y = -50; wrapped = true; }
      if (wrapped) this.trail = [];

      // 鱗のきらめきを時折こぼす
      this.sparkleTimer -= 1;
      if (this.sparkleTimer <= 0) {
        this.sparkleTimer = rand(6, 18);
        sparkles.push(new Sparkle(this.x, this.y, this.hue));
      }
    }

    draw(ctx) {
      const n = this.trail.length;
      // 光の帯（尾は細く淡く、頭に向かって太く明るく）
      for (let i = 0; i < n; i++) {
        const p = this.trail[i];
        const f = (i + 1) / n;
        ctx.beginPath();
        ctx.arc(p.x, p.y, this.size * f, 0, TAU);
        ctx.fillStyle = 'hsla(' + this.hue + ', 95%, ' + (55 + f * 20) + '%, ' + (0.055 * f) + ')';
        ctx.fill();
      }

      // 頭部 —— 白い芯を持つ光
      const r = this.size * 2.4;
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
      g.addColorStop(0, 'rgba(255,255,255,0.95)');
      g.addColorStop(0.25, 'hsla(' + this.hue + ', 100%, 78%, 0.8)');
      g.addColorStop(1, 'hsla(' + this.hue + ', 100%, 60%, 0)');
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, TAU);
      ctx.fillStyle = g;
      ctx.fill();
    }

    hit(px, py) {
      const dx = px - this.x;
      const dy = py - this.y;
      const r = Math.max(this.size * 4.5, 34);
      return dx * dx + dy * dy < r * r;
    }
  }

  /* ---------- 流れ星 ---------- */
  class ShootingStar {
    constructor(x, y, hue) {
      this.x = x;
      this.y = y;
      this.hue = hue;
      const angle = rand(-Math.PI * 0.76, -Math.PI * 0.56);
      const speed = rand(8, 13);
      this.vx = Math.cos(angle) * speed * (Math.random() < 0.5 ? 1 : -1);
      this.vy = Math.sin(angle) * speed;
      this.life = 1;
      this.trail = [];
      this.size = rand(3.5, 5.5);
      this.twinkle = rand(0, TAU);
    }

    update() {
      this.trail.push({ x: this.x, y: this.y });
      if (this.trail.length > 42) this.trail.shift();

      this.x += this.vx;
      this.y += this.vy;
      this.vy -= 0.055;
      this.twinkle += 0.4;

      if (Math.random() < 0.5) {
        sparkles.push(new Sparkle(this.x + rand(-6, 6), this.y + rand(-6, 6), this.hue));
      }

      if (this.y < -90 || this.x < -130 || this.x > W + 130) this.life -= 0.07;
      return this.life > 0;
    }

    draw(ctx) {
      const n = this.trail.length;
      for (let i = 0; i < n; i++) {
        const p = this.trail[i];
        const f = (i + 1) / n;
        ctx.beginPath();
        ctx.arc(p.x, p.y, this.size * f, 0, TAU);
        ctx.fillStyle = 'hsla(' + this.hue + ', 100%, 75%, ' + (0.4 * f * this.life) + ')';
        ctx.fill();
      }

      const tw = 1 + Math.sin(this.twinkle) * 0.35;
      const r = this.size * 2.4 * tw;
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
      g.addColorStop(0, 'rgba(255,255,255,0.98)');
      g.addColorStop(0.4, 'hsla(' + this.hue + ', 100%, 80%, 0.9)');
      g.addColorStop(1, 'hsla(' + this.hue + ', 100%, 65%, 0)');
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, TAU);
      ctx.fillStyle = g;
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,' + (0.8 * this.life) + ')';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(this.x - r * 1.8, this.y); ctx.lineTo(this.x + r * 1.8, this.y);
      ctx.moveTo(this.x, this.y - r * 1.8); ctx.lineTo(this.x, this.y + r * 1.8);
      ctx.stroke();
    }
  }

  /* ---------- 花びらのような光（変身の瞬間に舞う） ---------- */
  class Petal {
    constructor(x, y, hue) {
      this.x = x;
      this.y = y;
      this.hue = Math.random() < 0.5 ? hue : ACCENT_HUES[Math.floor(Math.random() * ACCENT_HUES.length)];
      const a = rand(0, TAU);
      const sp = rand(0.6, 4.5);
      this.vx = Math.cos(a) * sp;
      this.vy = Math.sin(a) * sp - rand(0.2, 1);
      this.rot = rand(0, TAU);
      this.rotSpeed = rand(-0.12, 0.12);
      this.w = rand(2.5, 6);
      this.h = rand(1.2, 2.6);
      this.life = 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.975;
      this.vy = this.vy * 0.975 - 0.012; // ふわりと浮き上がる
      this.rot += this.rotSpeed;
      this.life -= 0.012;
      return this.life > 0;
    }

    draw(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);
      ctx.beginPath();
      ctx.ellipse(0, 0, this.w * this.life + 0.1, this.h * this.life + 0.1, 0, 0, TAU);
      ctx.fillStyle = 'hsla(' + this.hue + ', 95%, 75%, ' + (0.8 * this.life) + ')';
      ctx.fill();
      ctx.restore();
    }
  }

  /* ---------- きらめき ---------- */
  class Sparkle {
    constructor(x, y, hue) {
      this.x = x + rand(-3, 3);
      this.y = y + rand(-3, 3);
      this.hue = hue;
      this.r = rand(0.5, 1.8);
      this.life = rand(0.5, 1);
      this.vy = rand(-0.3, 0.1);
    }

    update() {
      this.y += this.vy;
      this.life -= 0.02;
      return this.life > 0;
    }

    draw(ctx) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r * this.life + 0.1, 0, TAU);
      ctx.fillStyle = 'hsla(' + this.hue + ', 100%, 85%, ' + (0.75 * this.life) + ')';
      ctx.fill();
    }
  }

  /* ---------- 波紋 ---------- */
  class Ripple {
    constructor(x, y, big) {
      this.x = x;
      this.y = y;
      this.r = big ? 6 : 3;
      this.speed = big ? 4.2 : 2.6;
      this.alpha = big ? 0.55 : 0.3;
    }

    update() {
      this.r += this.speed;
      this.speed *= 0.985;
      this.alpha *= 0.955;
      return this.alpha > 0.01;
    }

    draw(ctx) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, TAU);
      ctx.strokeStyle = 'hsla(200, 100%, 80%, ' + this.alpha + ')';
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r * 0.62, 0, TAU);
      ctx.strokeStyle = 'hsla(260, 100%, 82%, ' + this.alpha * 0.6 + ')';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  /* ---------- 漂う光の粒・玉ボケ ---------- */
  class Mote {
    constructor() {
      this.x = rand(0, W);
      this.y = rand(0, H);
      this.r = rand(0.5, 2.2);
      this.phase = rand(0, TAU);
      this.speed = rand(0.06, 0.3);
      this.hue = HUES[Math.floor(Math.random() * HUES.length)];
    }

    update(t) {
      this.y -= this.speed;
      this.x += Math.sin(t * 0.0006 + this.phase) * 0.25;
      if (this.y < -10) { this.y = H + 10; this.x = rand(0, W); }
      this.alpha = 0.12 + 0.3 * (0.5 + 0.5 * Math.sin(t * 0.0016 + this.phase));
    }

    draw(ctx) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, TAU);
      ctx.fillStyle = 'hsla(' + this.hue + ', 90%, 80%, ' + this.alpha + ')';
      ctx.fill();
    }
  }

  class Bokeh {
    constructor() {
      this.x = rand(0, W);
      this.y = rand(0, H);
      this.r = rand(18, 70);
      this.phase = rand(0, TAU);
      this.hue = HUES[Math.floor(Math.random() * HUES.length)];
      this.speed = rand(0.02, 0.1);
    }

    update(t) {
      this.y -= this.speed;
      if (this.y < -this.r) { this.y = H + this.r; this.x = rand(0, W); }
      this.alpha = 0.015 + 0.02 * (0.5 + 0.5 * Math.sin(t * 0.0007 + this.phase));
    }

    draw(ctx) {
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r);
      g.addColorStop(0, 'hsla(' + this.hue + ', 100%, 75%, ' + this.alpha + ')');
      g.addColorStop(1, 'hsla(' + this.hue + ', 100%, 75%, 0)');
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, TAU);
      ctx.fillStyle = g;
      ctx.fill();
    }
  }

  /* ---------- 状態 ---------- */
  const FISH_COUNT = Math.min(16, Math.max(9, Math.floor(W * H / 90000)));
  const fishes = [];
  const stars = [];
  const petals = [];
  const sparkles = [];
  const ripples = [];
  const motes = [];
  const bokehs = [];
  const respawnQueue = [];

  for (let i = 0; i < FISH_COUNT; i++) fishes.push(new Fish(false));
  for (let i = 0; i < 70; i++) motes.push(new Mote());
  for (let i = 0; i < 9; i++) bokehs.push(new Bokeh());

  /* ---------- 魚 → 流れ星 ---------- */
  function transform(px, py) {
    for (let i = fishes.length - 1; i >= 0; i--) {
      const f = fishes[i];
      if (f.hit(px, py)) {
        stars.push(new ShootingStar(f.x, f.y, f.hue));
        for (let k = 0; k < 30; k++) petals.push(new Petal(f.x, f.y, f.hue));
        ripples.push(new Ripple(f.x, f.y, true));
        fishes.splice(i, 1);
        respawnQueue.push(performance.now() + 2400);
        return true;
      }
    }
    return false;
  }

  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  // PC: カーソルが触れたら / スマホ: タッチしたら
  let lastMoveRipple = 0;
  window.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse') return;
    const p = pointerPos(e);
    transform(p.x, p.y);
    const now = performance.now();
    if (now - lastMoveRipple > 160) {
      lastMoveRipple = now;
      ripples.push(new Ripple(p.x, p.y, false));
    }
  });
  window.addEventListener('pointerdown', (e) => {
    const p = pointerPos(e);
    if (!transform(p.x, p.y)) ripples.push(new Ripple(p.x, p.y, true));
  });

  /* ---------- オーロラのような光のリボン ---------- */
  function drawAurora(t) {
    for (let k = 0; k < 3; k++) {
      const baseY = H * (0.22 + k * 0.27);
      const hue = 195 + k * 38;
      ctx.beginPath();
      for (let x = -20; x <= W + 20; x += 24) {
        const y = baseY
          + Math.sin(x * 0.004 + t * 0.0005 + k * 2.1) * H * 0.05
          + Math.sin(x * 0.0013 - t * 0.0003 + k) * H * 0.08;
        if (x === -20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = 'hsla(' + hue + ', 100%, 70%, 0.04)';
      ctx.lineWidth = rand(26, 34);
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.strokeStyle = 'hsla(' + hue + ', 100%, 80%, 0.05)';
      ctx.lineWidth = 8;
      ctx.stroke();
    }
  }

  /* ---------- メインループ ---------- */
  function frame(t) {
    // 低アルファで塗り重ねて残像（光の余韻）を残す
    ctx.fillStyle = bgFade;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    drawAurora(t);

    for (const b of bokehs) { b.update(t); b.draw(ctx); }
    for (const m of motes) { m.update(t); m.draw(ctx); }

    for (const f of fishes) { f.update(t); f.draw(ctx); }

    for (let i = sparkles.length - 1; i >= 0; i--) {
      if (!sparkles[i].update()) sparkles.splice(i, 1);
      else sparkles[i].draw(ctx);
    }
    for (let i = petals.length - 1; i >= 0; i--) {
      if (!petals[i].update()) petals.splice(i, 1);
      else petals[i].draw(ctx);
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      if (!ripples[i].update()) ripples.splice(i, 1);
      else ripples[i].draw(ctx);
    }
    for (let i = stars.length - 1; i >= 0; i--) {
      if (!stars[i].update()) stars.splice(i, 1);
      else stars[i].draw(ctx);
    }

    ctx.restore();

    // 魚の補充
    const now = performance.now();
    while (respawnQueue.length && respawnQueue[0] <= now) {
      respawnQueue.shift();
      fishes.push(new Fish(true));
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
